name: E2E Tests

on:
  # `main` is the only long-lived branch: every change arrives on a short-lived topic branch
  # through a PR, so there is nothing else to trigger on. See "Working on this repo" in the README.
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Nightly regression at 02:00 UTC - this is where the @write suites and the journeys run.
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      grep:
        description: 'Only run tests matching this tag (e.g. @smoke)'
        required: false
        default: ''

# The target is a public demo instance shared with the world, so two runs of the same ref
# racing each other means duplicated writes and avoidable flake. Superseded PR/push runs are
# cancelled; scheduled runs get their own group so a push to main can never cancel the nightly.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

# Read-only by default. Only the `pages` job needs more, and it asks for it itself.
permissions:
  contents: read

env:
  CI: true
  BASE_URL: ${{ vars.BASE_URL || 'https://opensource-demo.orangehrmlive.com' }}
  ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME || 'Admin' }}
  ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD || 'admin123' }}

jobs:
  static-analysis:
    name: Typecheck & Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check

  # Read-only feature tests: the PR path. Sharded rather than split by project, so Playwright
  # balances the load itself - splitting by project put ~80% of the tests on one leg. Each shard
  # runs the `setup` project first (it is a dependency of `chromium`) and so logs in once.
  e2e:
    name: Features (shard ${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: static-analysis
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      # Every project in playwright.config.ts is Chromium-based; Firefox and WebKit are
      # opt-in via ALL_BROWSERS, which CI never sets.
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run tests
        run: npm run test:features:readonly -- --shard=${{ matrix.shard }}/${{ strategy.job-total }} ${{ inputs.grep && format('--grep {0}', inputs.grep) || '' }}
        env:
          BLOB_REPORT: true

      - name: Upload blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-${{ matrix.shard }}
          path: blob-report/
          retention-days: 7

  # One HTML report and one JUnit XML for the whole matrix, instead of a partial pair per shard.
  report:
    name: Merge reports
    # Runs even when shards failed - that report is the point. Skipped along with `e2e` when
    # static analysis gates the run, since there would be no blob artifacts to download.
    if: ${{ !cancelled() && needs.e2e.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      - name: Download blob reports
        uses: actions/download-artifact@v4
        with:
          pattern: blob-report-*
          path: all-blob-reports
          merge-multiple: true

      # Reporter output paths come from playwright.config.ts, hence --config. This renders all
      # three file reporters for the run as a whole: HTML, JUnit and the JSON the summary reads.
      - run: npm run report:merge

      # Puts the pass/fail/flaky counts on the run page itself, so a red X does not require
      # downloading an artifact to find out which tests failed.
      - name: Publish run summary
        if: ${{ !cancelled() }}
        run: node scripts/ci-summary.mjs test-results/report.json "Features (read-only)"

      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-features
          path: playwright-report/
          retention-days: 14

      # Published on success too: a green run's JUnit XML is what test-trend tooling consumes.
      - name: Upload JUnit report
        uses: actions/upload-artifact@v4
        with:
          name: junit-features
          path: test-results/junit.xml
          retention-days: 14

  # @write feature tests create employees, and one of them provisions an ESS login account the
  # demo gives no way to delete. Off the PR path for that reason - a merged PR would otherwise
  # leave an account behind on a public instance every time.
  write-suites:
    name: Features (@write)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: static-analysis
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # Unsharded and single-worker on purpose: the ESS fixture is worker-scoped, so one worker
      # means the whole run provisions exactly one account.
      - name: Run tests
        run: npm run test:features:write -- --workers=1

      - name: Publish run summary
        if: ${{ !cancelled() }}
        run: node scripts/ci-summary.mjs test-results/report.json "Features (@write)"

      - name: Upload HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-write
          path: playwright-report/
          retention-days: 14

      - name: Upload JUnit report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: junit-write
          path: test-results/junit.xml
          retention-days: 14

      - name: Upload traces & screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts-write
          path: test-results/
          retention-days: 7

  flows:
    name: E2E journeys (@flow)
    # Journeys are slower and create more data on the shared demo, so they are not on the
    # PR path - they run nightly and on demand.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: static-analysis
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run journeys
        run: npm run test:flows

      - name: Publish run summary
        if: ${{ !cancelled() }}
        run: node scripts/ci-summary.mjs test-results/report.json "E2E journeys (@flow)"

      - name: Upload HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-flows
          path: playwright-report/
          retention-days: 14

      - name: Upload JUnit report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: junit-flows
          path: test-results/junit.xml
          retention-days: 14

      # Journeys are the slowest and most stateful suite, so a failure here is the one most
      # worth having a trace for.
      - name: Upload traces & screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts-flows
          path: test-results/
          retention-days: 7

  # One live site at https://<owner>.github.io/<repo>/, always showing the most recent
  # deployed run. Every deploy replaces the last, so this is deliberately kept off the PR
  # path: a PR run and a nightly would otherwise overwrite each other, and a fork PR has no
  # write token to deploy with anyway. PRs get the step summary plus the report artifact.
  #
  # Whatever reports the run produced are published side by side under one landing page, so a
  # nightly's journeys are reachable and not hidden behind the features report.
  pages:
    name: Publish report to Pages
    # Publishes red runs too - a failing report is the one worth reading. Skipped when static
    # analysis gated the run, since no report artifact would exist to publish.
    if: >-
      ${{ !cancelled()
      && github.ref == 'refs/heads/main'
      && github.event_name != 'pull_request'
      && needs.report.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [report, write-suites, flows]
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    # The github-pages environment accepts one deployment at a time; a push to main landing
    # while the nightly deploys would otherwise fail the run. Queue instead of cancelling, so
    # the site ends up on the newer of the two.
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      # deploy-pages answers 404 "Not Found" when Pages has never been turned on for the repo,
      # which reads like a missing artifact rather than a missing setting. enablement turns it on
      # (source: GitHub Actions) using this job's `pages: write` token, so a fresh clone of this
      # repo publishes without a visit to Settings first. A no-op once Pages is already enabled.
      - name: Enable & configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      # merge-multiple is off on purpose: each artifact keeps its own directory, which is what
      # gives the landing page one entry per suite.
      - name: Download report artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: playwright-report-*
          path: downloads

      - name: Assemble the site
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_SHA: ${{ github.sha }}
          RUN_EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          SERVER: ${{ github.server_url }}
        run: |
          set -euo pipefail
          mkdir -p site
          : > suites.txt
          for report in downloads/playwright-report-*; do
            [ -d "$report" ] || continue
            suite="${report##*/playwright-report-}"
            mv "$report" "site/$suite"
            echo "$suite" >> suites.txt
          done
          if [ ! -s suites.txt ]; then
            echo "::error::no playwright-report-* artifacts were downloaded; nothing to publish"
            exit 1
          fi
          {
            echo '<!doctype html><html lang="en"><head><meta charset="utf-8">'
            echo '<meta name="viewport" content="width=device-width,initial-scale=1">'
            echo '<title>OrangeHRM E2E reports</title>'
            echo '<style>:root{color-scheme:light dark}'
            echo 'body{font:16px/1.6 system-ui,sans-serif;max-width:44rem;margin:4rem auto;padding:0 1.5rem}'
            echo 'h1{font-size:1.5rem;margin:0 0 .25rem}p{margin:0 0 2rem;opacity:.7;font-size:.9rem}'
            echo 'ul{list-style:none;padding:0}li{margin:0 0 .5rem}'
            echo 'a{display:block;padding:.9rem 1.1rem;border:1px solid currentColor;border-radius:.5rem;'
            echo 'text-decoration:none;font-weight:600;color:inherit}a:hover{opacity:.7}</style>'
            echo '</head><body><h1>OrangeHRM E2E reports</h1>'
            echo "<p>Run #${RUN_NUMBER} &middot; ${RUN_EVENT} &middot; <code>${RUN_SHA:0:7}</code> &middot;"
            echo "<a href=\"${SERVER}/${REPO}/actions/runs/${RUN_ID}\" style=\"display:inline;border:0;padding:0;text-decoration:underline\">workflow run</a></p>"
            echo '<ul>'
            while read -r suite; do
              echo "<li><a href=\"./${suite}/\">${suite}</a></li>"
            done < suites.txt
            echo '</ul></body></html>'
          } > site/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to Pages
        id: deploy
        uses: actions/deploy-pages@v4
